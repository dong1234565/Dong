<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东的个人网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        /* 导航栏 */
        nav {
            width: 100%;
            height: 60px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            position: sticky;
            top: 0;
            z-index: 99;
        }
        .logo {
            color: #fff;
            font-size: 22px;
            font-weight: bold;
        }
        .nav-link a {
            color: #fff;
            text-decoration: none;
            margin-left: 30px;
            font-size: 16px;
            transition: 0.3s;
        }
        .nav-link a:hover {
            color: #409eff;
        }
        /* 首页横幅 */
        .banner {
            width: 100%;
            height: 500px;
            background: linear-gradient(135deg, #409eff, #66b1ff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .banner h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .banner p {
            font-size: 20px;
            margin-bottom: 30px;
        }
        .btn {
            padding: 12px 36px;
            background: #fff;
            color: #409eff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
        }
        /* 通用区块 */
        section {
            padding: 80px 5%;
        }
        .title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 60px;
            color: #333;
        }
        /* 关于我们 */
        .about-box {
            display: flex;
            gap: 50px;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .about-img {
            width: 50%;
            height: 350px;
            background: #eee;
            border-radius: 8px;
        }
        .about-text h3 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #222;
        }
        .about-text p {
            line-height: 1.8;
            color: #666;
            font-size: 16px;
        }
        /* 服务板块 */
        .service-wrap {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .service-item {
            flex: 1;
            padding: 40px 20px;
            background: #f8f9fa;
            text-align: center;
            border-radius: 8px;
            transition: 0.3s;
        }
        .service-item:hover {
            background: #409eff;
            color: white;
        }
        .service-item h4 {
            font-size: 20px;
            margin: 15px 0;
        }
        /* 留言表单 */
        .msg-box {
            max-width: 700px;
            margin: 0 auto;
        }
        input, textarea {
            width: 100%;
            display: block;
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        textarea {
            height: 150px;
            resize: none;
        }
        .submit-btn {
            width: 100%;
            background: #409eff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .submit-btn:hover {
            background: #337ecc;
        }
        /* 页脚 */
        footer {
            width: 100%;
            padding: 30px;
            background: #222;
            color: #aaa;
            text-align: center;
        }
        /* 手机适配 */
        @media(max-width:768px) {
            .nav-link a {
                margin-left: 10px;
                font-size: 14px;
            }
            .banner h1 {
                font-size: 32px;
            }
            .about-box, .service-wrap {
                flex-direction: column;
            }
            .about-img {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 导航 -->
    <nav>
        <div class="logo">个人站点</div>
        <div class="nav-link">
            <a href="#home">首页</a>
            <a href="#about">关于</a>
            <a href="#service">服务</a>
            <a href="#message">留言</a>
        </div>
    </nav>

    <!-- 首页横幅 -->
    <div class="banner" id="home">
        <h1>欢迎来到东的游戏的网站</h1>
        <p>专注scratch turbowarp游戏制作可免费试玩免费下载。</p>
        <a href="#message" class="btn">立即咨询</a>
    </div>

    <!-- 关于板块 -->
    <section id="about">
        <h2 class="title">关于我们</h2>
        <div class="about-box">
            <div class="about-img"></div>
            <div class="about-text">
                <h3>专业游戏制作团队</h3>
                <p>我们拥有多年游戏开发经验，可搭建复杂游戏也可以搭建简洁游戏，代码简洁、加载速度快、适配手机电脑全设备。支持定制页面、功能开发、页面美化，一站式解决游戏需求。</p>
            </div>
        </div>
    </section>

    <!-- 服务板块 -->
    <section id="service" style="background:#f8f9fa;">
        <h2 class="title">我们的服务</h2>
        <div class="service-wrap">
            <div class="service-item">
                <h4>小型游戏搭建</h4>
                <p>简单游戏，复杂游戏，游戏定制，联系我们制作</p>
            </div>
            <div class="service-item">
                <h4>python游戏制作</h4>
                <p>简易游戏，小型软件，小型应用，联系我们制作</p>
            </div>
            <div class="service-item">
                <h4>游戏  定制开发</h4>
                <p>游戏下载器制作，游戏安装包制作</p>
            </div>
        </div>
    </section>

    <!-- 留言板块 -->
    <section id="message">
        <h2 class="title">在线留言</h2>
        <div class="msg-box">
            <input type="text" placeholder="请输入您的姓名">
            <input type="tel" placeholder="请输入联系电话">
            <textarea placeholder="请输入您想说的内容"></textarea>
            <input class="submit-btn" type="button" value="提交留言" onclick="alert('留言提交成功！')">
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <p>© 2026 个人网站 版权所有</p>
    </footer>

    <script>
        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                target.scrollIntoView({behavior: 'smooth'});
            })
        })
    </script>
</body>
</html>
